config_version = 14

[backdrop]
enabled = true

[bar]
order = [ "default" ]

[bar.default]
start = [ "control-center", "workspaces" ]
center = [ "date", "spacer_1", "clock" ]
end = [ "media", "notifications", "clipboard", "wallpaper", "wallhaven", "group:g1", "group:g2", "session" ]
concave_edge_corners = false
contact_shadow = false
margin_edge = 0
margin_ends = 8
position = "left"
radius = 16
radius_bottom_left = 0
radius_top_left = 0
shadow = false

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "volume", "brightness", "battery" ]
    opacity = 1.0
    padding = 6.0

[brightness]
minimum_brightness = 0.01

[calendar]
enabled = true
event_date_format = "%b %e (%a)"

    [calendar.account.personal_google]
    color = "primary"
    name = "Calendar"
    type = "google"

[[control_center.shortcuts]]
type = "wifi"

[[control_center.shortcuts]]
type = "bluetooth"

[[control_center.shortcuts]]
type = "caffeine"

[[control_center.shortcuts]]
type = "power_profile"

[dock]
shadow = false

[location]
auto_locate = true
custom_schedule = true
sunrise = "07:30"
sunset = "21:30"

[nightlight]
enabled = true
temperature_night = 1000

[plugin_settings."noctalia/notes"]
panel_placement = "floating"

[lockscreen_widgets]
enabled = false
schema_version = 2

[plugins]
enabled = [ "noctalia/timer", "noctalia/translator", "noctalia/wallhaven", "noctalia/notes" ]

[shell]
date_format = "%A, %Y-%m-%d"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "gtk3", "gtk4" ]

[wallpaper]
fill_mode = "fit"
transition_on_startup = true

[widget.audio_visualizer]
bands = 32
capsule = true
color_2 = "tertiary"
mirrored = false

[widget.bluetooth]
hide_when_no_connected_device = true

[widget.control-center]
capsule_radius = "auto"

[widget.date]
format = "{:%y %m %d}"

[widget.network]
show_label = false

[widget.spacer_1]
type = "spacer"
anchor = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"
